<!doctype html><html lang="en" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MemoryRelay visual QA fixture — sample data</title>
<link rel="stylesheet" href="../../src/styles/tokens.css"><link rel="stylesheet" href="../../src/styles/base.css"><link rel="stylesheet" href="../../src/styles/shell.css"><link rel="stylesheet" href="../../src/styles/system.css"><link rel="stylesheet" href="../../src/styles/screens.css"><link rel="stylesheet" href="../../src/styles/motion.css"><link rel="stylesheet" href="../../src/styles/workspace.css"><link rel="stylesheet" href="../../src/styles/redesign.css">
<style>.qa-demo{position:fixed;z-index:99;top:0;right:0;padding:5px 9px;background:#dbc98d;color:#1c2130;font:700 10px system-ui;pointer-events:none}.chart-grid{height:173px;width:100%}.chart-grid svg{display:block;width:100%;height:100%;}.qa-tab-icon{font-size:21px;line-height:1}.shell{max-width:100%}.screen.enter>*{animation:none!important}</style></head><body><div class="qa-demo">VISUAL FIXTURE / SAMPLE DATA</div>
<div class="shell"><header class="topbar"><div class="brand-mark"><img class="logo-mark" alt="" width="32" height="32" src="../../public/icons/icon-192.png"/><span class="brand">Memory Relay</span></div><button class="ib lg" aria-label="Refresh app">⟳</button><button class="ib lg" aria-label="Settings">⚙</button></header>
<main class="main"><div class="pane"><div class="screen home-screen" id="fixture"></div></div></main>
<nav class="tabbar"><div class="tabbar-in" style="--n:5;--i:0"><div class="tab-pill"></div><div class="tab on"><span class="qa-tab-icon">⌁</span>Live</div><div class="tab"><span class="qa-tab-icon">▤</span>Memory</div><div class="tab"><span class="qa-tab-icon">✧</span>Skills</div><div class="tab"><span class="qa-tab-icon">⎔</span>Agents</div><div class="tab"><span class="qa-tab-icon">⌘</span>Models</div></div></nav></div>
<script>
const f=document.getElementById('fixture');let view=new URLSearchParams(location.search).get('view')||'home';
const figures=[['mcp','MCP calls','2,184'],['skill','Skills selected','376'],['delegate','Delegated tasks','48'],['memory','Memory changes','189'],['provider','Model API calls','270'],['api','Dashboard API calls','3,306'],['tokens','Estimated tokens','722,979'],['errors','Errors','231']];
const chart=`<div class="chart-grid"><svg viewBox="0 0 360 170" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="lineFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b3b0ff" stop-opacity=".24"/><stop offset="1" stop-color="#b3b0ff" stop-opacity="0"/></linearGradient></defs><g stroke="#3d4762" stroke-opacity=".45" stroke-width=".7"><path d="M12 24H351M12 66H351M12 108H351M12 148H351"/></g><path fill="url(#lineFill)" d="M12 136C30 137 40 130 50 132S70 143 78 120 92 77 101 98 119 142 131 112 145 66 158 104 172 119 185 92 204 100 213 87 230 122 241 75 261 115 274 91 294 103 307 82 323 77 337 37 351 19L351 148H12Z"/><path d="M12 136C30 137 40 130 50 132S70 143 78 120 92 77 101 98 119 142 131 112 145 66 158 104 172 119 185 92 204 100 213 87 230 122 241 75 261 115 274 91 294 103 307 82 323 77 337 37 351 19" fill="none" stroke="#b3b0ff" stroke-width="3" stroke-linecap="round"/><g fill="#b3b0ff"><circle cx="158" cy="104" r="3"/><circle cx="241" cy="75" r="3"/><circle cx="351" cy="19" r="4"/></g></svg></div><div style="display:flex;justify-content:space-between;color:var(--muted);font-size:11px"><span>Oct 24</span><span>Nov 5</span><span>Nov 11</span><span>Nov 17</span><span>Nov 23</span></div>`;
const heat=`<div class="heat-grid">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map((d,i)=>`<div class="heat-row"><span>${d}</span>${Array.from({length:24},(_,j)=>`<i style="background:${(i*5+j*7)%10<5?'var(--paper2)':'color-mix(in srgb,var(--cobalt) '+((i*17+j*19)%60+22)+'%,var(--paper2))'}"></i>`).join('')}</div>`).join('')}<div class="heat-hours"><span>00</span><span>06</span><span>12</span><span>18</span><span>23 UTC</span></div></div>`;
if(view==='home')f.innerHTML=`<header class="home-hero"><div class="home-hero-top"><span class="dash-eyebrow">WORKSPACE / OVERVIEW</span><span class="dash-health up"><span></span>Systems online</span></div><h1>Overview</h1><p>Live usage, activity and network health in one place.</p></header><section class="overview-library"><div class="overview-library-head"><span class="dash-eyebrow">YOUR LIBRARY</span><span>Everything your agents can use</span></div><div class="overview-library-grid">${[['Memories','134','▣'],['Rules','5','◈'],['Skills','52','✧'],['AI keys','3','◇']].map(([n,v,i])=>`<button class="overview-library-card"><span class="overview-library-icon">${i}</span><strong>${v}</strong><span>${n}</span></button>`).join('')}</div></section><section class="monitor-root"><div class="monitor-header"><div><span class="dash-eyebrow">PERFORMANCE</span><h3>Usage at a glance</h3><p>All figures reflect recorded activity, not billing totals.</p></div><div class="monitor-period" role="group">${['1h','24h','7d','30d','90d'].map(x=>`<button class="${x==='30d'?'on':''}">${x}</button>`).join('')}</div></div><div class="monitor-metrics">${figures.filter(([id])=>["mcp","skill","tokens","errors"].includes(id)).map(([id,label,n])=>`<div class="monitor-metric metric-${id}"><span class="monitor-metric-label">${label}</span><b>${n}</b><span class="monitor-metric-meta">30 days <span>↗</span></span></div>`).join('')}</div><div class="card monitor-figure monitor-figure-primary"><div class="monitor-chart-title"><div><span class="dash-eyebrow">ACTIVITY INSIGHTS</span><h4>Activity trend</h4><p>30 days · Recorded events, not cumulative totals</p></div><div class="metric-dropdown"><button class="metric-dropdown-trigger" onclick="document.getElementById('metric-menu').hidden=!document.getElementById('metric-menu').hidden" aria-expanded="false">MCP calls <span class="metric-dropdown-chevron">⌄</span></button><div id="metric-menu" class="metric-dropdown-menu" role="listbox" hidden><div class="metric-dropdown-group">Metrics</div>${figures.map(([id,label])=>`<button role="option" class="metric-dropdown-option ${id==='mcp'?'selected':''}">${label}</button>`).join('')}</div></div></div>${chart}<h4>Hourly activity (UTC)</h4>${heat}</div><div class="card monitor-figure monitor-functions"><div class="monitor-chart-title"><h4>Most used functions</h4><span style="color:var(--muted);font-size:12px">Top 8 in 30 days</span></div><div class="monitor-breakdown"><span>Memory retrieval</span><b>884</b></div><div class="monitor-breakdown"><span>Skill selection</span><b>376</b></div><div class="monitor-breakdown"><span>Model routing</span><b>270</b></div></div></section>`;
if(view==='repos'){
 document.querySelector('.screen').className='screen skills-screen';
 const data=[['impeccable','pbakaus','Up to date','24 imported'],['frontend-design','anthropics','Tracked','8 imported'],['ui-ux-pro-max-skill','nextlevelbuilder','Tracked','12 imported'],['logo-design-skill','kaankiziltug','Needs review','0 imported'],['system-design','openai','Tracked','3 imported']];
 f.innerHTML=`<div class="phead"><div class="grow"><span class="dash-eyebrow">SKILLS / SOURCES</span><h2 style="margin:5px 0">Your skill library</h2><p>Curated tools for every connected agent.</p></div></div><section class="card stack" aria-label="GitHub skill repositories"><div class="chead"><div class="grow"><span class="dash-eyebrow">SOURCES & INTEGRATIONS</span><h3>Connected repositories</h3><div class="sub">Bring in trusted skills, scripts and reference material. Sync automatically or when you choose.</div></div></div><div class="repo-list-scroll" role="region">${data.map(([name,owner,status,number])=>`<div class="repo-list-item stack"><div class="repo-card-heading"><div class="repo-card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="15" rx="3"/><path d="M3 10h18M8 5V3m8 2V3"/></svg></div><div class="repo-card-name grow"><strong>${name}</strong><span class="repo-location">by ${owner} · Auto-discover skills</span></div><span aria-hidden="true" style="font-size:20px;color:var(--cobalt)">◉</span></div><div class="repo-meta"><span class="repo-pill ${status==='Needs review'?'problem':'up'}"><i></i>${status}</span><span class="repo-pill">${number}</span><span class="repo-pill">Auto sync</span></div><div class="repo-card-subnote">Last checked today, 20:16 UTC</div><button class="repo-card-open">Open repository <span>→</span></button></div>`).join('')}</div><p class="repo-scroll-hint">↓ Scroll to explore all 5 repositories</p><details class="repo-add"><summary><strong>+ Connect another repository</strong></summary></details></section>`;
}
if(view==='repoDetail'){
 document.querySelector('.screen').className='screen skills-screen';
 f.innerHTML=`<section class="repo-workspace stack"><button class="repo-back">← All repositories</button><header class="repo-detail-hero"><span class="dash-eyebrow">SKILLS / REPOSITORY</span><div class="repo-detail-title"><span class="repo-card-icon">✧</span><div><h1>frontend-design</h1><p>anthropics · main</p></div></div><div class="repo-meta"><span class="repo-pill">Connected</span><span class="repo-pill">8 imported skills</span><span class="repo-pill">27 resources</span></div></header><div class="repo-detail-tabs"><button class="active">Overview</button><button>Files</button><button>Settings</button></div><div class="repo-detail-panel"><div class="repo-stats"><div><small>Imported skills</small><b>8</b></div><div><small>Resource files</small><b>27</b></div><div><small>Sync mode</small><b>Active</b></div></div><section class="card repo-info-card"><h3>Sync activity</h3><p class="muted small">Last checked Nov 23, 2026 UTC</p><p class="muted small">All 8 skills are current. No action needed.</p><div class="repo-actions"><button class="btn">Sync now</button><button class="btn ghost">Full re-check</button></div></section><section class="card repo-info-card"><h3>Automatic sync</h3><p class="muted small">Keep this source up to date</p></section></div></section>`;
}
if(view==='memory'){
 document.querySelector('.screen').className='screen memory-screen';
 f.innerHTML=`<header class="phead"><div class="grow"><span class="dash-eyebrow">KNOWLEDGE BASE</span><h2 style="margin:5px 0">Memories</h2><p>Clear, structured context your agents can trust.</p></div></header><div class="stack list"><div class="mem open"><div class="mem-main"><button class="mem-preview"><span class="mem-preview-title">RIVNA — Deployment checklist</span><span class="mem-preview-action">Collapse ⌃</span></button><div class="mem-detail"><div class="memory-markdown"><p class="memory-md-heading"><strong>RIVNA — Deployment checklist</strong></p><ul class="memory-md-list"><li><em>Release:</em> Manual signed beta promotion after successful evidence checks</li><li><em>Security:</em> Keep production deployments protected and never expose keys</li><li><em>Verification:</em> All relevant emulator tests must pass</li></ul><div class="memory-md-code"><div class="memory-md-code-head"><span>bash</span><button>Copy</button></div><pre><code>cd /mnt/Rivna
npm test
npm run build</code></pre></div><p>Release only with **verified evidence**.</p></div></div><span class="meta"><span class="src">Owner notes</span><span>#rivna</span><span>Today</span></span></div></div><div class="mem"><div class="mem-main"><button class="mem-preview"><span class="mem-preview-title">Cographide — Knowledge graph</span><span class="mem-preview-action">Read memory ⌄</span></button><p class="mem-preview-snippet">Graph scanner, repository sync, complete wiki with readable labels and mobile navigation.</p><span class="meta"><span class="src">Claude Code</span><span>#design</span></span></div></div></div>`;
}
</script></body></html>
